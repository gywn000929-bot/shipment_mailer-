<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>발주 점검</title>
<!-- 발주 점검 전용 링크: 메일 작성기의 발주 점검 화면만 연다. ?who=nam 이면 남효주 설정, 없으면 김민지 계장 설정 -->
<script>
(function () {
  var q = new URLSearchParams(location.search);
  if (!q.get("who")) q.set("who", "kim");
  q.set("solo", "ord");
  location.replace("index.html?" + q.toString() + location.hash);
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=index.html?who=kim&amp;solo=ord"></noscript>
</head><body style="font-family:sans-serif;padding:24px">발주 점검 화면으로 이동합니다… <a href="index.html?who=kim&amp;solo=ord">바로 가기</a></body></html>
